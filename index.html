<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Explore | Find your community</title>
    <meta name="description" content="Discover and join gaming, music, coding, art and technology communities, or start your own. Available in English and Persian." />
    <meta name="theme-color" content="#0f121a" />
    <meta name="color-scheme" content="dark light" />

    <!-- %SITE_URL% is replaced at build time with the domain from src/config/site.ts. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:site_name" content="Explore" />
    <meta property="og:title" content="Explore | Find your community" />
    <meta property="og:description" content="Discover and join gaming, music, coding, art and technology communities, or start your own." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      // Apply the saved language, theme and display settings before the page paints, so it
      // never flashes the wrong theme or direction. Keep in sync with PreferencesContext.tsx.
      (function () {
        try {
          var root = document.documentElement;
          var read = function (key) {
            var raw = localStorage.getItem(key);
            return raw === null ? null : JSON.parse(raw);
          };
          var lang = read("settings.language");
          if (lang !== "fa" && lang !== "en") {
            var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
            lang = langs.some(function (l) { return (l || "").toLowerCase().indexOf("fa") === 0; }) ? "fa" : "en";
          }
          root.lang = lang;
          root.dir = lang === "fa" ? "rtl" : "ltr";

          var theme = read("settings.theme") || "dark";
          var light = theme === "light" || (theme === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          root.classList.toggle("light", light);
          root.classList.toggle("dark", !light);
          root.style.colorScheme = light ? "light" : "dark";

          if (read("settings.compactMode") === true) root.classList.add("compact");
          if (read("settings.animations") === false) root.classList.add("reduce-motion");
        } catch (e) {
          // Storage blocked: keep the defaults above.
        }
      })();
    </script>
  </head>

  <body>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">This site needs JavaScript. / این سایت برای کار کردن به جاوااسکریپت نیاز دارد.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
